<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SuraStore</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: #ffffff;
        }

        header {
            width: 100%;
            padding: 20px 40px;
            background: #111116;
            border-bottom: 1px solid #25252d;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            opacity: 0.7;
        }

        .hero {
            min-height: 420px;
            padding: 80px 30px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .hero h1 {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 600px;
            color: #a8a8b3;
            font-size: 18px;
            line-height: 1.6;
        }

        .products-section {
            padding: 50px 40px;
            max-width: 1200px;
            margin: auto;
        }

        .products-section h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: #15151c;
            border: 1px solid #282832;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .product:hover {
            transform: translateY(-4px);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: #20202a;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #777783;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            margin-bottom: 10px;
        }

        .product-info p {
            color: #9999a5;
            margin-bottom: 15px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 80px;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #25252d;
            color: #777783;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            nav a {
                margin-left: 12px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .products-section {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">SuraStore</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
        </nav>
    </header>

    <main>

        <section class="hero" id="home">
            <h1>Welcome to SuraStore</h1>

            <p>
                Discover our products and find what you're looking for.
            </p>
        </section>

        <section class="products-section" id="products">

            <h2>Products</h2>

            <div class="products">

                <div class="product">
                    <div class="product-image">
                        Product Image
                    </div>

                    <div class="product-info">
                        <h3>Example Product</h3>

                        <p>
                            Product description goes here.
                        </p>

                        <div class="price">
                            $0.00
                        </div>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <footer>
        © 2026 SuraStore. All rights reserved.
    </footer>

</body>
</html>
