<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SuraStore</title>
<style>
:root{--y:#ffe000;--bg:#030303;--panel:#0b0b0b;--line:#292929;--muted:#9b9b9b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
.page{position:relative;width:min(100vw,1024px);min-height:1536px;background:#050505;overflow:hidden;box-shadow:0 0 90px rgba(255,224,0,.13)}
.page:before,.page:after{content:"";position:absolute;top:0;bottom:0;width:62px;pointer-events:none;z-index:0}
.page:before{left:0;background:linear-gradient(90deg,rgba(255,224,0,.52),rgba(255,224,0,.13),transparent)}
.page:after{right:0;background:linear-gradient(270deg,rgba(255,224,0,.52),rgba(255,224,0,.13),transparent)}
.shell{position:relative;z-index:1;width:900px;max-width:calc(100% - 124px);margin:0 auto;background:linear-gradient(180deg,#050505 0%,#080808 78%,#060606 100%)}
.header{height:120px;display:flex;align-items:center;direction:ltr;padding:0 35px;gap:25px}
.hamb{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;padding:0}
.hamb span,.hamb span:before,.hamb span:after{display:block;width:39px;height:4px;border-radius:4px;background:#fff;content:"";position:relative}
.hamb span:before{position:absolute;top:-12px}
.hamb span:after{position:absolute;top:12px}
.logo{display:flex;align-items:center;gap:17px;flex:1}
.bag{width:48px;height:52px;position:relative;border:4px solid var(--y);border-radius:12px 12px 9px 9px}
.bag:before{content:"";position:absolute;left:10px;top:-18px;width:20px;height:17px;border:4px solid var(--y);border-bottom:0;border-radius:14px 14px 0 0}
.brand{font-weight:700;font-size:39px;line-height:1;letter-spacing:-1.8px}
.brand span{color:var(--y)}
.tagline{margin-top:7px;color:#aaa;font-size:17px;letter-spacing:.2px}
.head-actions{display:flex;gap:25px;align-items:center}
.user,.cart{width:70px;height:70px;border:1px solid #272727;border-radius:19px;background:#080808;display:grid;place-items:center;position:relative}
.user svg,.cart svg{width:39px;height:39px;stroke:#fff;fill:none;stroke-width:2.5}
.cart .count{position:absolute;right:-8px;top:-9px;width:36px;height:36px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;font-weight:700;font-size:16px}
.search-row{display:flex;gap:14px;padding:0 25px;margin-top:0}
.search-box{height:90px;border:2px solid var(--y);border-radius:27px;display:flex;align-items:center;direction:ltr;flex:1;background:#0a0a0a;box-shadow:0 0 18px rgba(255,224,0,.03) inset}
.search-icon{width:64px;display:grid;place-items:center}
.search-icon svg{width:35px;height:35px;stroke:#a9a9a9;fill:none;stroke-width:2.5}
.search-box input{height:100%;flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:27px;padding-right:20px}
.search-box input::placeholder{color:#777;opacity:1}
.settings{width:88px;height:90px;border:2px solid var(--y);border-radius:27px;background:#0a0a0a;display:grid;place-items:center}
.settings svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:2.5}
.categories{display:flex;gap:17px;padding:30px 25px 24px;direction:ltr;overflow:hidden}
.cat{height:72px;border-radius:25px;border:1px solid #2c2c2c;background:#0b0b0b;color:#fff;padding:0 27px;font-size:23px;display:flex;align-items:center;gap:15px;white-space:nowrap}
.cat svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.3}
.cat.active{background:var(--y);border-color:var(--y);color:#000;font-weight:700}
.arrow{width:66px;height:66px;flex:0 0 66px;border-radius:50%;border:1px solid #333;background:#111;color:#fff;font-size:42px;line-height:1;display:grid;place-items:center}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 25px}
.card{position:relative;background:linear-gradient(180deg,#101010,#090909);border:1px solid #303030;border-radius:20px;overflow:hidden;min-width:0}
.card-media{height:205px;position:relative;background:#0b0b0b;display:grid;place-items:center}
.card-media img{width:100%;height:100%;object-fit:cover;display:block}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.015)}
.label{position:absolute;left:14px;top:14px;padding:10px 13px;border-radius:15px;background:var(--y);color:#000;font-size:18px;font-weight:700;z-index:2}
.favorite{position:absolute;right:10px;top:10px;width:54px;height:54px;border:0;border-radius:50%;background:rgba(10,10,10,.84);display:grid;place-items:center;z-index:2}
.favorite svg{width:29px;height:29px;stroke:#fff;fill:none;stroke-width:2.1}
.info{padding:14px 17px 17px}
.name{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:17px;color:#a0a0a0;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;direction:ltr}
.price{font-size:23px;font-weight:700;color:var(--y)}
.old{font-size:16px;color:#666;text-decoration:line-through;margin-left:8px}
.buy{width:56px;height:56px;border:2px solid var(--y);border-radius:14px;background:transparent;display:grid;place-items:center}
.buy svg{width:30px;height:30px;stroke:var(--y);fill:none;stroke-width:2.2}
.buy:hover,.buy:active{background:var(--y)}
.buy:hover svg,.buy:active svg{stroke:#000}
.trust{margin-top:39px;height:130px;border-top:1px solid #262626;border-bottom:1px solid #262626;display:grid;grid-template-columns:repeat(3,1fr);direction:ltr}
.trust-item{display:flex;align-items:center;justify-content:center;gap:19px;border-right:1px solid #242424}
.trust-item:last-child{border-right:0}
.trust-icon{width:47px;height:47px}
.trust-icon svg{width:47px;height:47px;stroke:var(--y);fill:none;stroke-width:2}
.trust-title{font-size:19px;font-weight:700}
.trust-sub{font-size:15px;color:#9b9b9b;margin-top:7px}
.footer{height:136px;padding:30px 25px 18px;display:flex;align-items:flex-start;justify-content:space-between;direction:ltr}
.footer-brand{font-size:28px;font-weight:700}
.footer-brand span{color:var(--y)}
.copy{margin-top:7px;color:#a0a0a0;font-size:15px}
.socials{display:flex;gap:32px;padding-top:17px}
.socials svg{width:30px;height:30px;fill:#fff;stroke:none}
.bottom-line{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:235px;height:7px;background:var(--y);border-radius:10px;box-shadow:0 0 15px rgba(255,224,0,.3)}
.state{grid-column:1/-1;text-align:center;color:#888;padding:50px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:none}
.overlay.open{display:block}
.panel{position:fixed;z-index:60;background:#080808;border:1px solid #333;color:#fff}
.menu-panel{top:90px;left:max(calc((100vw - 900px)/2),15px);width:250px;border-radius:16px;padding:12px;display:none}
.menu-panel.open{display:block}
.menu-panel button{width:100%;background:transparent;border:0;color:#fff;text-align:left;padding:14px;border-radius:10px;font-size:16px}
.menu-panel button:hover{background:var(--y);color:#000}
.settings-panel{top:210px;right:max(calc((100vw - 900px)/2 + 25px),15px);width:240px;border-radius:16px;padding:15px;display:none}
.settings-panel.open{display:block}
.settings-panel label{display:block;color:#999;font-size:13px;margin-bottom:7px}
.settings-panel select{width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:10px;padding:11px;outline:0}
.cart-panel{top:0;right:-430px;width:430px;height:100vh;transition:right .25s;padding:25px;overflow:auto}
.cart-panel.open{right:0}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.panel-title h2{margin:0;color:var(--y)}
.close{width:42px;height:42px;border:1px solid var(--y);border-radius:10px;background:#111;color:var(--y);font-size:25px}
.cart-list{display:flex;flex-direction:column;gap:10px}
.cart-row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #252525;padding:12px 0}
.cart-row img{width:65px;height:65px;object-fit:cover;border-radius:9px}
.cart-row .ci{flex:1}
.cart-row .ci b{display:block;font-size:14px}
.cart-row .ci span{display:block;color:var(--y);font-size:13px;margin-top:5px}
.remove{background:none;border:0;color:#888;font-size:24px}
.total{border-top:1px solid #333;margin-top:15px;padding-top:18px;display:flex;justify-content:space-between;font-size:18px}
.total strong{color:var(--y)}
.modal{position:fixed;z-index:70;inset:0;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.8)}
.modal.open{display:grid}
.modal-card{width:min(700px,100%);background:#090909;border:1px solid #333;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;position:relative}
.modal-img{height:380px;background:#111}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-info{padding:35px}
.modal-info h2{margin:0;font-size:27px}
.modal-info p{color:#999;line-height:1.7}
.modal-price{font-size:29px;color:var(--y);font-weight:700;margin:25px 0}
.modal-add{width:100%;height:52px;border:0;border-radius:12px;background:var(--y);font-weight:700}
.toast{position:fixed;z-index:100;bottom:25px;left:50%;transform:translateX(-50%);background:var(--y);color:#000;padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
@media(max-width:700px){
 .page{min-height:100vh;width:100vw}
 .shell{width:100%;max-width:none}
 .page:before,.page:after{width:32px}
 .header{height:120px;padding:0 24px;gap:15px}
 .brand{gap:10px}
 .bag{width:42px;height:47px}
 .brand{font-size:31px}
 .tagline{font-size:14px}
 .head-actions{gap:10px}
 .user,.cart{width:62px;height:62px}
 .search-row{padding:0 25px}
 .search-box{height:90px}
 .search-box input{font-size:23px}
 .settings{width:84px;height:90px}
 .categories{gap:13px}
 .cat{height:72px;font-size:21px;padding:0 23px}
 .products{gap:14px}
 .card-media{height:180px}
 .name{font-size:19px}
 .desc{font-size:15px}
 .price{font-size:20px}
 .buy{width:52px;height:52px}
 .trust-item{gap:10px}
 .trust-title{font-size:16px}
 .trust-sub{font-size:12px}
 .footer-brand{font-size:24px}
 .copy{font-size:13px}
 .socials{gap:18px}
 .cart-panel{width:min(430px,100vw)}
}
@media(max-width:430px){
 .page:before,.page:after{width:15px}
 .header{padding:0 16px;gap:8px}
 .hamb{width:38px}
 .hamb span,.hamb span:before,.hamb span:after{width:34px;height:3px}
 .brand{gap:7px}
 .bag{width:35px;height:39px;border-width:3px;border-radius:9px}
 .bag:before{left:7px;top:-13px;width:16px;height:12px;border-width:3px}
 .brand{font-size:24px;letter-spacing:-1px}
 .tagline{font-size:11px;margin-top:5px}
 .user,.cart{width:49px;height:49px;border-radius:14px}
 .user svg,.cart svg{width:28px;height:28px}
 .cart .count{width:26px;height:26px;font-size:12px;right:-6px;top:-7px}
 .search-row{padding:0 16px;gap:8px}
 .search-box{height:68px;border-radius:21px}
 .search-icon{width:48px}
 .search-icon svg{width:28px;height:28px}
 .search-box input{font-size:17px;padding-right:12px}
 .settings{width:68px;height:68px;border-radius:21px}
 .settings svg{width:31px;height:31px}
 .categories{padding:22px 16px 18px;gap:8px}
 .cat{height:54px;border-radius:18px;font-size:16px;padding:0 14px;gap:8px}
 .cat svg{width:22px;height:22px}
 .arrow{width:50px;height:50px;flex-basis:50px;font-size:32px}
 .products{padding:0 16px;gap:9px}
 .card{border-radius:15px}
 .card-media{height:125px}
 .label{left:8px;top:8px;padding:6px 9px;border-radius:11px;font-size:12px}
 .favorite{right:7px;top:7px;width:40px;height:40px}
 .favorite svg{width:22px;height:22px}
 .info{padding:9px}
 .name{font-size:14px}
 .desc{font-size:11px;margin-top:4px}
 .price-row{margin-top:8px}
 .price{font-size:15px}
 .old{font-size:10px}
 .buy{width:38px;height:38px;border-radius:10px}
 .buy svg{width:22px;height:22px}
 .trust{height:auto;grid-template-columns:1fr;gap:0}
 .trust-item{min-height:85px;border-right:0;border-bottom:1px solid #242424;justify-content:flex-start;padding-left:30px}
 .trust-item:last-child{border-bottom:0}
 .footer{height:145px;padding:24px 16px 16px}
 .footer-brand{font-size:22px}
 .copy{font-size:11px}
 .socials{gap:13px;padding-top:8px}
 .socials svg{width:24px;height:24px}
 .bottom-line{width:200px;height:6px}
 .modal-card{grid-template-columns:1fr}
 .modal-img{height:250px}
 .modal-info{padding:22px}
}
</style>
</head>
<body>
<div class="page" id="page">
<div class="shell">
<header class="header">
<button class="hamb" id="menuBtn" aria-label="Menu"><span></span></button>
<div class="logo">
<div class="bag"></div>
<div><div class="brand">Sura<span>Store</span></div><div class="tagline">More Than a Store</div></div>
</div>
<div class="head-actions">
<button class="user" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.2 3.5-7 8-7s8 2.8 8 7"></path></svg></button>
<button class="cart" id="cartBtn" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 8H7"></path><circle cx="10" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle></svg><span class="count" id="cartCount">0</span></button>
</div>
</header>

<section class="search-row">
<div class="search-box"><div class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></div><input id="search" type="search" placeholder="Search for products..."></div>
<button class="settings" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"></path><path d="m19.4 15 .9 1.6-2 2-1.6-.9a7.7 7.7 0 0 1-2 1.2l-.4 1.8h-2.8l-.4-1.8a7.7 7.7 0 0 1-2-1.2l-1.6.9-2-2 .9-1.6a7.7 7.7 0 0 1-1.2-2l-1.8-.4V9.8l1.8-.4a7.7 7.7 0 0 1 1.2-2L4.5 5.8l2-2 1.6.9a7.7 7.7 0 0 1 2-1.2l.4-1.8h2.8l.4 1.8a7.7 7.7 0 0 1 2 1.2l1.6-.9 2 2-.9 1.6a7.7 7.7 0 0 1 1.2 2l1.8.4v2.8l-1.8.4a7.7 7.7 0 0 1-1.2 2Z"></path></svg></button>
</section>

<section class="categories" id="categories">
<button class="cat active" data-category="all"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>All</button>
<button class="cat" data-category="electronics"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1"></rect><path d="M8 21h8M12 17v4"></path></svg>Electronics</button>
<button class="cat" data-category="audio"><svg viewBox="0 0 24 24"><path d="M5 13v-2a7 7 0 0 1 14 0v2"></path><rect x="3" y="12" width="4" height="7" rx="2"></rect><rect x="17" y="12" width="4" height="7" rx="2"></rect></svg>Audio</button>
<button class="cat" data-category="accessories"><svg viewBox="0 0 24 24"><path d="m20 13-7 7-9-9V4h7l9 9Z"></path><circle cx="7.5" cy="7.5" r="1"></circle></svg>Accessories</button>
<button class="arrow" id="catNext">›</button>
</section>

<section class="products" id="products"></section>

<section class="trust">
<div class="trust-item"><div class="trust-icon"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"></path><circle cx="7" cy="19" r="2"></circle><circle cx="18" cy="19" r="2"></circle></svg></div><div><div class="trust-title">Fast Shipping</div><div class="trust-sub">Across the region</div></div></div>
<div class="trust-item"><div class="trust-icon"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-3Z"></path><path d="m8 12 2.5 2.5L16 9"></path></svg></div><div><div class="trust-title">Secure Payment</div><div class="trust-sub">100% protected</div></div></div>
<div class="trust-item"><div class="trust-icon"><svg viewBox="0 0 24 24"><path d="M5 13v-2a7 7 0 0 1 14 0v2"></path><rect x="3" y="12" width="4" height="7" rx="2"></rect><rect x="17" y="12" width="4" height="7" rx="2"></rect><path d="M19 19c0 1.5-1.5 2-3 2"></path></svg></div><div><div class="trust-title">24/7 Support</div><div class="trust-sub">We're here for you</div></div></div>
</section>

<footer class="footer">
<div><div class="footer-brand">Sura<span>Store</span></div><div class="copy">© 2024 SuraStore. All rights reserved.</div></div>
<div class="socials">
<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 12 16.5 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 12 14.5 2.5 2.5 0 0 0 12 9.5ZM17.5 6a1.2 1.2 0 1 1-1.2 1.2A1.2 1.2 0 0 1 17.5 6Z"/></svg>
<svg viewBox="0 0 24 24"><path d="M14.2 2v12.1a4.8 4.8 0 1 1-3.4-4.6v3.1a1.9 1.9 0 1 0 1.4 1.8V2h2Z"/></svg>
<svg viewBox="0 0 24 24"><path d="M22 12c0-5.5-4.5-10-10-10S2 6.5 2 12s4.5 10 10 10 10-4.5 10-10Zm-13 3.5v-7l6 3.5-6 3.5Z"/></svg>
<svg viewBox="0 0 24 24"><path d="M20.5 5.5A17.6 17.6 0 0 0 16 4l-.6 1.2a12.8 12.8 0 0 0-6.8 0L8 4a17.6 17.6 0 0 0-4.5 1.5C2.4 9 1.8 12.7 2.1 16.5A17.8 17.8 0 0 0 7 19l1.1-1.5a10 10 0 0 1-1.6-.8l.4-.3c3.2 1.5 7 1.5 10.2 0l.4.3c-.5.3-1 .6-1.6.8l1.1 1.5a17.8 17.8 0 0 0 4.9-2.5c.3-3.8-.3-7.5-1.4-11Zm-10 9.1c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm3 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>
</div>
</footer>
<div class="bottom-line"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="panel menu-panel" id="menuPanel"><button data-goto="products">Products</button><button data-goto="categories">Categories</button><button id="menuCart">Cart</button></div>
<div class="panel settings-panel" id="settingsPanel"><label>Sort products</label><select id="sort"><option value="default">Default</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="az">Name: A-Z</option></select></div>
<div class="panel cart-panel" id="cartPanel"><div class="panel-title"><h2>Your Cart</h2><button class="close" id="closeCart">×</button></div><div class="cart-list" id="cartList"></div><div class="total"><span>Total</span><strong id="total">$0.00</strong></div></div>
<div class="modal" id="modal"><div class="modal-card"><button class="close" id="closeModal" style="position:absolute;right:12px;top:12px;z-index:2">×</button><div class="modal-img" id="modalImg"></div><div class="modal-info"><h2 id="modalName"></h2><p id="modalDesc"></p><div class="modal-price" id="modalPrice"></div><button class="modal-add" id="modalAdd">Add to Cart</button></div></div></div>
<div class="toast" id="toast"></div>
</div>
<script type="module">

let products=[...demo], active='all', cart=JSON.parse(localStorage.getItem('suraCart')||'[]'), current=null;
const $=id=>document.getElementById(id);
const money=n=>'$'+Number(n||0).toFixed(2);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
const cartSvg='<svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 8H7"></path><circle cx="10" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle></svg>';
const heartSvg='<svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.5-8.8 11-8.8 11S3.2 14.3 3.2 8.8A4.7 4.7 0 0 1 12 6a4.7 4.7 0 0 1 8.8 2.8Z"></path></svg>';
function render(){
 let term=$('search').value.trim().toLowerCase();
 let list=products.filter(p=>(active==='all'||String(p.category||'').toLowerCase()===active)&&((p.name||'').toLowerCase().includes(term)||(p.desc||p.description||'').toLowerCase().includes(term)));
 const s=$('sort').value;
 if(s==='low')list.sort((a,b)=>Number(a.price)-Number(b.price));
 if(s==='high')list.sort((a,b)=>Number(b.price)-Number(a.price));
 if(s==='az')list.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
 $('products').innerHTML=list.map(p=>`<article class="card" data-id="${esc(p.id)}"><div class="card-media"><img src="${p.image}" alt="${esc(p.name)}" loading="lazy">${p.tag?`<span class="label">${esc(p.tag)}</span>`:''}<button class="favorite" aria-label="Favorite">${heartSvg}</button></div><div class="info"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.desc||p.description||'')}</div><div class="price-row"><div class="price">${money(p.price)}${p.old?`<span class="old">${esc(p.old)}</span>`:''}</div><button class="buy" aria-label="Add to cart">${cartSvg}</button></div></div></article>`).join('')||'<div class="state">No products found.</div>';
 document.querySelectorAll('.card').forEach(card=>{const p=products.find(x=>x.id===card.dataset.id);card.querySelector('.buy').onclick=e=>{e.stopPropagation();add(p)};card.querySelector('.favorite').onclick=e=>e.stopPropagation();card.onclick=()=>openModal(p)});
}
async function load(){try{const q=query(collection(db,'products'),where('published','==',true));const snap=await getDocs(q);const remote=snap.docs.map(d=>({id:d.id,...d.data()}));products=[...remote,...demo];}catch(e){console.warn('Firebase unavailable; using demo products.',e)}render();}
function add(p){if(!p)return;cart.push(p);localStorage.setItem('suraCart',JSON.stringify(cart));updateCart();toast('Added to cart');}
function updateCart(){$('cartCount').textContent=cart.length;$('cartList').innerHTML=cart.length?cart.map((p,i)=>`<div class="cart-row"><img src="${p.image}" alt=""><div class="ci"><b>${esc(p.name)}</b><span>${money(p.price)}</span></div><button class="remove" data-i="${i}">×</button></div>`).join(''):'<div style="color:#777;text-align:center;padding:40px 0">Your cart is empty.</div>';$('total').textContent=money(cart.reduce((s,p)=>s+Number(p.price||0),0));document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.i),1);localStorage.setItem('suraCart',JSON.stringify(cart));updateCart()})}
function openCart(){closePanels();$('overlay').classList.add('open');$('cartPanel').classList.add('open')}
function closeCart(){$('cartPanel').classList.remove('open');if(!$('menuPanel').classList.contains('open')&&!$('settingsPanel').classList.contains('open'))$('overlay').classList.remove('open')}
function closePanels(){$('menuPanel').classList.remove('open');$('settingsPanel').classList.remove('open');$('overlay').classList.remove('open')}
function openModal(p){current=p;$('modalImg').innerHTML=`<img src="${p.image}" alt="${esc(p.name)}">`;$('modalName').textContent=p.name;$('modalDesc').textContent=p.desc||p.description||'';$('modalPrice').textContent=money(p.price);$('modal').classList.add('open')}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1700)}
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=b.dataset.category;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
$('settingsBtn').onclick=e=>{e.stopPropagation();closePanels();$('overlay').classList.add('open');$('settingsPanel').classList.add('open')};
$('menuBtn').onclick=e=>{e.stopPropagation();closePanels();$('overlay').classList.add('open');$('menuPanel').classList.add('open')};
$('overlay').onclick=()=>{closePanels();closeCart()};
$('cartBtn').onclick=openCart;$('closeCart').onclick=closeCart;$('menuCart').onclick=openCart;
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{closePanels();$(b.dataset.goto).scrollIntoView({behavior:'smooth'})});
$('catNext').onclick=()=>document.querySelector('.categories').scrollBy({left:260,behavior:'smooth'});
$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('modalAdd').onclick=()=>{add(current);$('modal').classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();closeCart();$('modal').classList.remove('open')}});
updateCart();load();
</script>
</body>
</html>
